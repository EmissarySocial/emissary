name: Gosec
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  GOFLAGS: "-buildvcs=false"

jobs:

  gosec:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # gosec reads export data from the build cache, and the shared setup-go cache has held
        # data its x/tools cannot decode since go 1.27.2, so build from a cold cache instead
        cache: false

    # gosec v2.29.0 ships golang.org/x/tools v0.49.0, which cannot read Go 1.27's export data,
    # so it loses type information on a third of the files and still reports "0 issues".  Build
    # it against a newer x/tools instead.  Drop this once a gosec release requires x/tools >= v0.51.0.
    - name: Install Gosec
      working-directory: ${{ runner.temp }}
      run: |
        mkdir gosec-build && cd gosec-build
        printf 'module gosecbuild\n\ngo 1.27.2\n' > go.mod
        printf '//go:build tools\n\npackage tools\n\nimport _ "github.com/securego/gosec/v2/cmd/gosec"\n' > tools.go
        GOFLAGS=-mod=mod go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.51.0
        GOFLAGS=-mod=mod go build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec

    # Suppressions live inline as `// #nosec <rule> -- <reason>`, never in a config file, so
    # the justification sits beside the code a reviewer is reading.  See go-hardening.
    - name: Security lint
      run: gosec ./...
