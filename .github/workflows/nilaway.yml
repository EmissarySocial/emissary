name: Nilaway
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  GOFLAGS: "-buildvcs=false"

jobs:

  nilaway:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    # Pin nilaway to an explicit version (it publishes only pseudo-versions,
    # no semver tags) so the installed tool is predictable, not @latest.
    - name: Install NilAway
      run: go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260617211854-01ab7e30fbe0

    # Two exclusions, both required.  The docstring marker drops service/icons.go, whose
    # Get() exceeds NilAway's hard 500-block CFG limit -- reported as an INTERNAL ERROR that
    # also abandons every other finding in the `service` package.  -exclude-test-files drops
    # the tests that pass a literal nil Session on purpose, which NilAway traces into
    # production code as a nil flow.  See service/AGENTS.md.
    - name: Nil panic checks
      run: nilaway -exclude-file-docstrings="nilaway:ignore-file" -exclude-test-files ./...
