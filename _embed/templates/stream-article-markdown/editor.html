<!-- Uses https://github.com/Ionaru/easy-markdown-editor, vendored in theme-global/resources -->
<link rel="stylesheet" href="/.themes/global/resources/easymde-2.21.0/easymde.min.css">
<style>
	.EasyMDEContainer {

		.CodeMirror {
			color: var(--black);
			background-color: var(--gray10);
			caret-color: var(--black);

			.CodeMirror-cursor {
				border-left: 1px solid var(--black)!important;
			}
		}

		.editor-toolbar {
			button {
				&.active {
					color:var(--white);
					background-color:var(--gray50);
					border-color:var(--gray60);
				}
				&:hover {
					background-color: var(--gray20);
				}
			}
		}
	}
</style>

<article>
	<textarea id="markdownContent">{{.ContentRaw}}</textarea>
</article>

<script type="text/javascript">

	// RULE: init must survive an htmx swap.  When you navigate here from another page this
	// fragment is swapped into <main>, and htmx loads external scripts ASYNCHRONOUSLY -- so
	// EasyMDE is still undefined when an inline script runs, and the editor dies with
	// "Can't find variable: EasyMDE".  Init therefore runs three ways: immediately (full page
	// load, where the parser has already run the library), from the script tag's onload (the
	// swap case), and never twice, because EasyMDE replaces the textarea with a CodeMirror and
	// a second pass would stack a second editor on top.
	function emissaryInitMarkdownEditor() {

		if (!window.EasyMDE) {
			return;
		}

		var element = document.getElementById("markdownContent");

		if ((element === null) || element.emissaryEasyMDE) {
			return;
		}

		element.emissaryEasyMDE = true;

		// RULE: easyMDE must be global -- beforeSave() in the hyperscript block below reads it
		// to copy the editor's value into the shared #saveFormContent field.
		window.easyMDE = new EasyMDE({

			// RULE: the toolbar is spelled out button-by-button so that each one can name a
			// Bootstrap Icons class.  EasyMDE's built-in buttons hardcode FontAwesome names, and
			// with no FontAwesome on the page they render as blank squares -- so the library
			// injects a <link> to maxcdn.bootstrapcdn.com the moment it starts.  Bootstrap Icons
			// is already loaded by includes-head, which makes that download pure waste.  Note the
			// "iconClassMap" option cannot do this: EasyMDE merges it into its options and then
			// never reads it back for built-in buttons.
			toolbar: [
				{name: "bold",           action: EasyMDE.toggleBold,           className: "bi bi-type-bold",     title: "Bold"},
				{name: "italic",         action: EasyMDE.toggleItalic,         className: "bi bi-type-italic",   title: "Italic"},
				{name: "heading",        action: EasyMDE.toggleHeadingSmaller, className: "bi bi-type-h1",       title: "Heading"},
				"|",
				{name: "quote",          action: EasyMDE.toggleBlockquote,     className: "bi bi-quote",         title: "Quote"},
				{name: "unordered-list", action: EasyMDE.toggleUnorderedList,  className: "bi bi-list-ul",       title: "Bulleted List"},
				{name: "ordered-list",   action: EasyMDE.toggleOrderedList,    className: "bi bi-list-ol",       title: "Numbered List"},
				"|",
				{name: "link",           action: EasyMDE.drawLink,             className: "bi bi-link-45deg",    title: "Link"},
				{name: "image",          action: EasyMDE.drawImage,            className: "bi bi-image",         title: "Image"},
				"|",
				{name: "guide", action: "https://www.markdownguide.org/basic-syntax/", className: "bi bi-question-circle", title: "Markdown Guide", noDisable: true},
			],

			// RULE: belt and braces on the icons above -- this is the switch that actually
			// suppresses the FontAwesome download, and it must stay false even if the toolbar
			// changes.
			autoDownloadFontAwesome: false,

			// RULE: EasyMDE's own spell-checker XHRs a ~500KB en_US dictionary from a CDN on
			// every load, and only knows English.  Turning it off falls back to the browser's
			// native spellcheck, which needs no download and follows the reader's own language.
			spellChecker: false,

			element: element,
			uploadImage: true,
			imageUploadEndpoint: "/{{.StreamID}}/upload-image",
			imagePathAbsolute: true,
		});

		window.easyMDE.codemirror.on("blur", function() {
			save();
		});
	}
</script>
<script src="/.themes/global/resources/easymde-2.21.0/easymde.min.js" onload="emissaryInitMarkdownEditor()"></script>
<script type="text/javascript">emissaryInitMarkdownEditor();</script>

<script type="text/hyperscript">

	def beforeSave()
		set #saveFormContent.value to easyMDE.value()
	end

</script>
