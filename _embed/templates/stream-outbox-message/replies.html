<!-- replies: the first page of replies, each drawn in this one request, so the list arrives at its final height -->
{{- $root := . -}}
{{- $replies := .ReplyLinksAfter (.QueryParam "after") 12 -}}

<div class="table">
	{{- range $replies -}}
		{{- template "reply-row" (array $root .URI) -}}
	{{- end -}}
</div>
{{- template "reply-script" -}}
