<div id="responses" class="margin-top" hx-target="this" hx-swap="outerHTML" hx-push-url="false">

	<hr class="margin-bottom-sm"/>

	<div class="flex-row flex-align-center flex-wrap">
		{{- template "note-actions" . -}}
		<!-- The buttons lead and the pill tabs sit at the right, as under a Qwertylicious photo, episode, or place -->
		<div role="tablist" class="pills margin-bottom-none flex-grow-1 align-right">
			<span role="tab" hx-get="{{.BasePath}}/responses-replies?url={{.Permalink}}" aria-selected="true">
				{{- .ReplyCount }} {{pluralize .ReplyCount "Reply" "Replies" -}}
			</span>
			<span role="tab" hx-get="{{.BasePath}}/responses-likes?url={{.Permalink}}" aria-selected="false">
				{{- .LikeCount }} {{pluralize .LikeCount "Like" "Likes" -}}
			</span>
			<span role="tab" hx-get="{{.BasePath}}/responses-announces?url={{.Permalink}}" aria-selected="false">
				{{- .ShareCount }} {{pluralize .ShareCount "Share" "Shares" -}}
			</span>
		</div>
	</div>

	<hr class="margin-top-sm"/>

	<!-- Reply sits in note-actions.html, beside Like and Share -->
	<div id="replies" class="margin-vertical">
		{{.View "replies"}}
	</div>

		</div>
	{{- end -}}
	-->
</div>
