<!-- Empty by design.

     This is the slot where a Template puts controls that change the SHAPE of the page,
     alongside the widget placement it already arranges here.  Template.Inherit copies a
     parent's named templates only where the child has not defined that name, so any
     Template that ships its own layout-controls.html replaces this one automatically,
     and every other Template renders nothing.

     Anything that changes identity, content, or destination belongs in the settings
     form instead -- this slot is for shape and position only. -->
