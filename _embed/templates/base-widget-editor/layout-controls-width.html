<!-- A reusable "page width" control for the layout-controls slot.  It lives here, rather than
     being copied into each Template that wants it, because the three values, the empty-means-
     LARGE rule below, and the CSS that reads the chosen option are one contract that has to
     move together.  A Template opts in by defining its own layout-controls.html containing
     nothing but a call to this one.

     The select posts as "data.width" inside the widget editor's own form, so the change handler
     saves it through the pipeline that already saves widget order.  The base stylesheet
     re-proportions the centre column straight from the chosen option, so the canvas responds
     before the round trip finishes.

     RULE: templates are minified before they are parsed, and the minifier knows nothing about
     Go actions.  Two traps shape the markup below, and neither one raises an error:

       - An action inside a TAG is read as attribute markup and lowercased, so a conditional
         written between two attributes has its own string literals lowercased and then never
         matches.  Hence no conditional "selected" attribute.
       - An action inside a <select> is read as a stray text node in an element that admits
         only <option>, and is DELETED outright.  Hence the whole <select> repeated per branch
         rather than a conditional around each option.

     TestEmbeddedTemplates_ActionsSurviveMinification catches both.

     FULL is the final "else" rather than a case of its own, so an unset or unrecognized value
     selects it.  That is honest rather than merely convenient: an empty width renders "layout-"
     on the page, which matches no rule and fills the width exactly like FULL.

     RULE: that fold has to happen HERE, because "select" has no default of its own -- it
     answers "selected" only on a match.  Without it an unset width leaves EVERY option
     unselected, the browser falls back to showing the first one, and the select then posts
     that value: opening the Layout tab and moving a widget would quietly rewrite the width.
     Keeping one option always selected is what makes the field honest in every POST.

     The comparison is up here in element content rather than down in the tag, so its literals
     keep their case through the minifier. -->

{{- $width := .DataString "width" -}}

{{- if not (or (eq $width "LARGE") (eq $width "MEDIUM") (eq $width "SMALL")) -}}
	{{- $width = "FULL" -}}
{{- end -}}

<!-- RULE: the arguments below are lowercase ON PURPOSE, and "select" matches them without
     regard to case.  This action sits INSIDE a tag, where the minifier reads it as attribute
     markup and lowercases the whole thing -- a `FULL` written here is already a `full` by the
     time the template is parsed.  Spelling it that way makes minification a no-op rather than
     something the helper has to undo, so the guard in
     TestEmbeddedTemplates_ActionsSurviveMinification stays strict for everyone else. -->
<div class="widget-editor-control widget-editor-width">
	<label for="widget-editor-width">Page Width</label>
	<select id="widget-editor-width" name="data.width">
		<option value="FULL" {{select $width `full`}}>Full width</option>
		<option value="LARGE" {{select $width `large`}}>Large (3/4 width)</option>
		<option value="MEDIUM" {{select $width `medium`}}>Medium (2/3 width)</option>
		<option value="SMALL" {{select $width `small`}}>Small (1/2 width)</option>
	</select>
</div>
