{{- $themes := .Themes -}}
{{- $themeID := .QueryParam "themeId" -}}
{{- $theme := .Theme $themeID -}}

<h1>Select a Theme</h1>

<div class="margin-vertical">
	{{ range $themes }}
	<div class="clickable card padding" hx-post="/startup/choose?themeId={{.ThemeID}}">
		<div class="bold">{{.Label}}</div>
		<div>{{.Description}}</div>
	</div>
	{{ end }}
</div>

<div class="flex-row">
	<button script="on click send closeModal">Close Window</button>
	<div class="margin-vertical text-sm text-light-gray flex-grow align-right">
		Themes installed by your server administrator
	</div>
</div>
