{{- $isDesktop := .IsDesktop -}}

<div class="app" script="init send SelectNav(id:'settings')">
	<title>Profile | General</title>

	{{- if $isDesktop -}}
		<div id="app-sidebar" class="flex-column flex-justify-between expanded">
			{{- template "menu" "general" -}}
		</div>
	{{- end -}}
	
	<div class="app-content padding">

		<div id="menu-bar">
			<div class="left">
				{{ if not $isDesktop }}
					<a href="/@me/settings/mobile" class="turboclick" hx-boost="true">{{icon "back"}}</a>
				{{ end }}
				<a href="/@me/settings/general" class="turboclick selected" hx-boost="true">General</a>
				<a href="/@me/settings/images" class="turboclick" hx-boost="true">Images</a>
				<a href="/@me/settings/links" class="turboclick" hx-boost="true">Links</a>
			</div>
			<div class="right">
				<a href="https://emissary.dev/user-profile" target="_blank" rel="noopener noreferrer" class="link">
					{{icon "help"}}
					{{ if $isDesktop }} Help {{ end }}
				</a>
			</div>
		</div>

		<div class="card border padding transition-main-card">
			{{.View "general-form"}}
		</div>
	</div>
</div>

<script>
[...document.styleSheets].forEach((s,i)=>console.log(i, s.href||'(inline)', s.cssRules?.length??'CORS'));
const f=document.querySelector('.transition-main-card form');
console.log('form rect', JSON.stringify(f.getBoundingClientRect()));
console.log('textarea rect', JSON.stringify(document.querySelector('#statusMessage_textarea').getBoundingClientRect()));
</script>
