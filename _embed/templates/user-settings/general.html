{{- $isDesktop := .IsDesktop -}}

<div class="app" script="init send SelectNav(id:'settings')">
	<title>Profile | General</title>

	{{- if $isDesktop -}}
		<div id="app-sidebar" class="flex-column flex-justify-between expanded">
			{{- template "menu" "general" -}}
		</div>
	{{- end -}}

	<!-- The tabs and forms come from the user's outbox template (see base-outbox) -->
	<div
		id="profile-settings"
		class="app-content padding"
		hx-get="/@me/settings-general"
		hx-trigger="load"
		hx-target="this"
		hx-swap="innerHTML"
		hx-push-url="false">
		<div class="card border padding transition-main-card text-gray">Loading...</div>
	</div>
</div>
