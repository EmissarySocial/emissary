<!--
{{- /*
	notifications-modal.html is the "Device Settings" section of the Notification Options modal.
	It renders ABOVE the channel-toggles form (see the notifications-modal action in
	template.hjson: view-html runs before edit).

	The device toggle is browser-owned state (pushManager), so it cannot be a schema form field:
	JS hydrates it from the actual subscription, and it is APPLIED ON SAVE — the Save click is the
	user gesture that Notification.requestPermission requires.  Cancel applies nothing.  If the
	permission prompt is denied, nothing changes and the toggle re-hydrates honestly on next open.
*/ -}}

<div class="margin-bottom">
	<div class="bold">Device Settings</div>
	<label id="push-device-row" class="hide">
		<input type="checkbox" id="push-device-toggle" data-original="false">
		<span>Use push notifications on this device</span>
	</label>
	<div id="push-device-unavailable" class="text-sm text-gray hide">Push notifications are not available in this browser.</div>
	<div id="push-device-blocked" class="text-sm text-gray hide">Push notifications are blocked. To enable them, allow notifications for this site in your browser settings.</div>
</div>

<script>
(function() {
	var row = document.getElementById("push-device-row");
	var toggle = document.getElementById("push-device-toggle");
	var unavailable = document.getElementById("push-device-unavailable");
	var blocked = document.getElementById("push-device-blocked");
	var vapid = "{{.WebPushPublicKey}}";

	if (!row) { return; }

	// Feature-detect: only offer push where the browser and a VAPID key are available.
	if (!vapid || !("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
		unavailable.classList.remove("hide");
		return;
	}

	// Hard-blocked at the browser level: the toggle would be inert, so explain instead.
	if (Notification.permission === "denied") {
		blocked.classList.remove("hide");
		return;
	}

	function urlBase64ToUint8Array(base64String) {
		var padding = "=".repeat((4 - base64String.length % 4) % 4);
		var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
		var raw = window.atob(base64);
		var output = new Uint8Array(raw.length);
		for (var i = 0; i < raw.length; ++i) { output[i] = raw.charCodeAt(i); }
		return output;
	}

	var swReady = navigator.serviceWorker.register("/.web-push-worker.js").then(function() {
		return navigator.serviceWorker.ready;
	});

	// Hydrate the toggle from the browser's actual subscription state.
	swReady.then(function(reg) {
		return reg.pushManager.getSubscription();
	}).then(function(sub) {
		toggle.checked = !!sub;
		toggle.setAttribute("data-original", sub ? "true" : "false");
		row.classList.remove("hide");
	}).catch(function() {
		unavailable.classList.remove("hide");
	});

	async function subscribe() {
		var reg = await swReady;
		var permission = await Notification.requestPermission();
		if (permission !== "granted") { return; }
		var sub = await reg.pushManager.subscribe({
			userVisibleOnly: true,
			applicationServerKey: urlBase64ToUint8Array(vapid)
		});
		await fetch("/@me/push-subscriptions", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(sub)
		});
	}

	async function unsubscribe() {
		var reg = await swReady;
		var sub = await reg.pushManager.getSubscription();
		if (sub) {
			await fetch("/@me/push-subscriptions", {
				method: "DELETE",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ endpoint: sub.endpoint })
			});
			await sub.unsubscribe();
		}
	}

	// Apply the device toggle when the channel form is saved.  The listener is delegated on
	// document (the form is a sibling rendered after this script); re-opening the modal
	// replaces the previous listener, and a submit with no toggle in the DOM is a no-op.
	if (window._emissaryPushDeviceSubmit) {
		document.removeEventListener("submit", window._emissaryPushDeviceSubmit, true);
	}
	window._emissaryPushDeviceSubmit = function() {
		var el = document.getElementById("push-device-toggle");
		if (!el || el !== toggle) { return; }
		var wanted = toggle.checked;
		var original = toggle.getAttribute("data-original") === "true";
		if (wanted === original) { return; }

		// Fire-and-forget: runs alongside the form POST.
		if (wanted) {
			subscribe().catch(function() {});
		} else {
			unsubscribe().catch(function() {});
		}
	};
	document.addEventListener("submit", window._emissaryPushDeviceSubmit, true);
})();
</script>
-->
