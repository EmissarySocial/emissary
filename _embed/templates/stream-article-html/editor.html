<article class="flex-grow flex-column">
	<textarea id="htmlContent" class="flex-grow width-100%" style="min-height:600px" aria-labelledby="htmlContentLabel">{{.ContentRaw}}</textarea>
	<div id="htmlContentLabel" class="text-gray text-sm padding-vertical-xs">This HTML content will be displayed directly on your web page.</div>
</article>

<script type="text/hyperscript">

	def beforeSave()
		set #saveFormContent.value to #htmlContent.value
	end

	on blur from #htmlContent
		save()
	end

</script>
