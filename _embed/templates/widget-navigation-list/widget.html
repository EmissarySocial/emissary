<div class="widget widget-navigation" hx-target="main" hx-swap="innerHTML" hx-push-url="true">

	{{- if ne "" (.Widget.Data.GetString "title") -}}
		<div class="bold">{{- .Widget.Data.GetString "title" -}}</div>
	{{- end -}}

	<!-- Enter the tier chain at the top of the family tree.  Each tier decides for itself
	     whether it can render, then hands off to the next one, so a tier that is unset or
	     impossible for this Stream drops out of the chain instead of ending it. -->
	{{- template "grandparents" . -}}

</div>
