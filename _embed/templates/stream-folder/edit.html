<div class="page h-item">

	{{- template "edit-menubar" . -}}

	<table class="table">
		<thead>
			<tr>
				<th colspan="2">Name</th>
				<th>Date</th>
			</tr>
		</thead>
		<tbody script="install sortContainer">
			{{- if .UserCan "add-child" -}}
				<tr hx-get="/{{.StreamID}}/add-child" role="button">
					<td colspan="4" class="link bold">{{icon "add"}} Add Item</td>
				</tr>
			{{- end -}}
			{{- range .Children.ByRank.Slice -}}
				<tr class="draggable h-entry" hx-get="/{{.Token}}/edit">
					<input type="hidden" name="keys" value="{{.StreamID}}"/>
					<td class="drag-handle">{{icon "drag-handle"}}</td>
					<td class="clickable nowrap">{{.Label}}</td>
					<td class="clickable">{{.PublishDate | shortDate}}</td>
					<td class="clickable text-sm align-right">
						<a href="/{{.Token}}" class="button">View</a>
					</td>
				</tr>
			{{- end -}}
		</tbody>
	</table>

	<div
		hx-get="/{{.StreamID}}/edit" 
		hx-trigger="refreshPage from:window" 
		hx-target="main" 
		hx-swap="innerHTML" 
		hx-push-url="true">
	</div>

	{{- if .UserCan "sort" -}}
		<!-- onload drives the sortContainer behavior above: htmx loads this ASYNCHRONOUSLY when
		     the page arrives via a swap, so the behavior installs before Sortable exists. -->
		<script
			src="/.themes/global/resources/sortable-1.15.7/Sortable.min.js"
			onload="window.dispatchEvent(new Event('sortableReady'))"></script>

		<form
			hx-post="/{{.StreamID}}/sort" 
			hx-push-url="false" 
			hx-swap="none"
			hx-trigger="end from:document"
			hx-include="[name=keys]">
		</form>

	{{- end -}}

</div>
