{{- $iconURL := .IconURL -}}
<div class="flex-row flex-align-center">
	<div class="width-48">
		{{- if ne "" $iconURL -}}
			<img src="{{$iconURL}}" alt="" class="circle width-64">
		{{- else -}}
			<div class="circle width-64 flex-center">{{icon "person"}}</div>
		{{- end -}}
	</div>
	<div>
		<h1 class="text-xl margin-none">Follow {{.DisplayName}}</h1>
		<div class="text-gray"><a href="{{.ProfileURL}}">@{{.Username}}@{{.Hostname}}</a></div>
	</div>
</div>
<hr>
