{{- template "follow-heading" . -}}

<div class="camper-show-if-has-accounts">

	<div class="text-sm margin-vertical-sm">Follow from your signed in account:</div>

	<div 
		class="margin-bottom-sm camper-accounts" 
		data-camper-intent="follow"
		data-camper-object="{{.Permalink}}"
		hx-on:camper:hide="htmx.trigger(window, 'closeModal')">
	</div>

	<div class="margin-vertical-xl"></div>

	<div class="text-sm margin-vertical-sm">Or follow from another service:</div>
</div>

<div class="camper-hide-if-has-accounts">

	<div class="text-sm margin-vertical-sm">Follow me from any of these services:</div>

	<button hx-get="/@{{.UserID}}/follow-activitypub" class="flex-row width-100% margin-bottom-sm">
		<div class="text-2xl margin-none">⁂</div>
		<div class="flex-grow">
			<div class="text-lg bold margin-none">Fediverse</div>
			<div class="text-sm text-gray">Using Mastodon and other ActivityPub servers (best)</div>
		</div>
		<div class="text-lg">{{icon "chevron-right"}}</div>
	</button>

</div>

{{- if .IsBridgeBluesky -}}

	<a href="https://bsky.app/profile/{{.BlueskyHandle}}" target="_blank" rel="noopener noreferrer" class="button flex-row width-100% margin-bottom-sm">
		<div class="text-2xl margin-none">{{icon "bluesky"}}</div>
		<div class="flex-grow">
			<div class="text-lg bold margin-none">BlueSky</div>
			<div class="text-sm text-gray">Via any ATProto server (better)</div>
		</div>
		<div class="text-lg">{{icon "chevron-right"}}</div>
	</a>

{{- end -}}

<button hx-get="/@{{.UserID}}/follow-email" class="flex-row width-100% margin-bottom-sm">
	<div class="text-2xl margin-none">{{icon "email"}}</div>
	<div class="flex-grow flex-align-cent">
		<div class="text-lg bold margin-none">Email</div>
		<div class="text-sm text-gray margin-none ">Updates in your email inbox (one-way only)</div>
	</div>
	<div class="text-lg">{{icon "chevron-right"}}</div>
</button>

<script src="/.themes/global/resources/camperjs-0.2.0/camper.js"></script>

{{- template "follow-styles" -}}
