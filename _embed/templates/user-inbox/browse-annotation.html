<!-- The Notes view of the browse modal: the post and its thread, with the note editor below. -->
{{- $url := .QueryParam "url" -}}
{{- $document := .ActivityStream $url -}}

{{- template "browse-header" (array . $url "annotation") -}}

<div id="modal-body" class="turboclick padding-top" hx-target="#modal-window" hx-swap="innerHTML" hx-push-url="false">

	{{- template "browse-parent" (array . $document "annotation") -}}

	<div id="scroll-bottom" class="margin-top-lg" script="init scrollIntoView() me"></div>

	{{.View "annotation-editor"}}
</div>

<script type="text/hyperscript">
	init
	set selectedNode to #id_{{$document.Metadata.HashedID}}
	take .selected from .card for the selectedNode then
	scrollIntoView() the selectedNode
</script>
