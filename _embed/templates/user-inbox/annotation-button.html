<!-- The annotation button for one URL: either state opens the post with its note editor (browse-annotation).
     Every copy for the same URL re-fetches itself on annotationChanged (theme-global annotationPeer).
     ?selected=true marks the button whose Notes panel is open, and survives the refresh. -->
{{- $url := .QueryParam "url" -}}
{{- $annotation := .Annotation $url -}}
{{- $selected := eq "true" (.QueryParam "selected") -}}

<span
	hx-get="/@me/newsfeed/annotation-button?url={{$url | urlquery}}{{if $selected}}&selected=true{{end}}"
	hx-trigger="refresh"
	hx-target="this"
	hx-swap="outerHTML"
	hx-push-url="false"
	data-annotation-url="{{$url}}"
	script="install annotationPeer">

	<!-- A filled icon means a note exists; the selected style means its Notes panel is open -->
	<button class="turboclick{{if $selected}} selected{{end}}" hx-get="/@me/newsfeed/browse-annotation?url={{$url | urlquery}}">
		{{- if $annotation.IsNew -}}{{icon "bookmark"}} Notes{{- else -}}{{iconFilled "bookmark"}} Noted{{- end -}}
	</button>

</span>
