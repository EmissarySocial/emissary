<!-- Welcome for an empty folder; index.html passes ?welcome=folder (see AGENTS.md). -->
{{- $folder := (.FoldersWithSelection "FOLDER").Selected -}}

<div class="align-center margin-vertical-xl">
	<div class="text-light-gray" style="font-size:96px;">
		{{icon $folder.Icon}}
	</div>
	<div class="text-2xl margin-none">
		This is the {{$folder.Label}} Folder
	</div>
	<div class="margin-vertical max-width-512 margin-horizontal-auto">
		Folders are a part of your inbox.
		Organize your communities into folders and switch between them easily.
	</div>
	<button hx-get="/@me/settings/following-search?folderId={{$folder.FolderID.Hex}}" class="primary turboclick margin-top-lg">{{icon "add"}} Follow Someone</button>
</div>
