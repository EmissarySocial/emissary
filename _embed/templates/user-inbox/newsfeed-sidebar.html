<!-- News Feed sidebar; re-fetches itself on refreshSidebar to keep the unread dots current. -->
{{- $folders := .FoldersWithSelection (first (.QueryParam "section") "FOLDER") -}}

<div id="app-sidebar" class="expanded"
	hx-get="/@me/newsfeed/newsfeed-sidebar?folderId={{$folders.SelectedID.Hex}}&section={{$folders.Section}}"
	hx-trigger="refreshSidebar from:window"
	hx-target="#app-sidebar"
	hx-swap="outerHTML"
	hx-push-url="false">
	{{- template "newsfeed-menu" $folders -}}
</div>
