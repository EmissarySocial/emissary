{{ $notification := . }}
{{- $actor := $notification.Actor -}}

<div
	role="button"
	hx-get="/@me/newsfeed/browse?url={{$notification.ObjectURL}}"
	hx-push-url="true"
	class="notification flex-row flex-align-center padding-vertical hover-trigger {{if $notification.NotRead}}unread{{end}}">

	<!-- Unread dot -->
	<span class="notification-dot text-red" style="width:12px;">
		{{- if $notification.NotRead -}}&#9679;{{- end -}}
	</span>

	<!-- Actor avatar (opens the actor card) -->
	<div class="width-32">
		{{- if $actor.HasIconURL -}}
			<img src="{{$actor.IconURL}}" alt="" class="circle width-32">
		{{- else -}}
			<div class="circle width-32 flex-center bg-gray-90">{{icon "person"}}</div>
		{{- end -}}
	</div>

	<!-- Verb + summary -->
	<div class="flex-grow ellipsis-block">
		<div class="text-gray text-sm">
			<span class="bold">{{$actor.Name}}</span>
			<span>replied to you</span>
		</div>
		<div class="ellipsis">{{$notification.ObjectSummary}}</div>
	</div>

	<!-- Relative time -->
	<div class="text-sm text-gray nowrap">{{$notification.CreateDate | tinyDate}}</div>

</div>
