{{- $currentID := (.Theme .ThemeID).ThemeID -}}

<h1 id="modal-title">{{icon "palette"}} Choose Theme</h1>

<!-- RULE: Choosing a theme only opens theme-confirm; theme-switch is the one step that saves (see AGENTS.md) -->
<div class="margin-bottom-lg">
	{{- range .Themes -}}
		{{- if eq .ThemeID $currentID -}}
			<div class="button selected flex-row flex-align-center width-100% margin-bottom-sm" style="pointer-events:none" aria-current="true">
				{{- template "theme-icon" . -}}
				<div class="flex-grow bold" style="white-space:normal">{{.Label}}</div>
			</div>
		{{- else -}}
			<button hx-get="/admin/domain/theme-confirm?themeId={{.ThemeID}}" class="flex-row flex-align-center width-100% margin-bottom-sm">
				{{- template "theme-icon" . -}}
				<div class="flex-grow" style="white-space:normal">{{.Label}}</div>
				<div class="text-lg">{{icon "chevron-right"}}</div>
			</button>
		{{- end -}}
	{{- end -}}
</div>

<div>
	<button script="on click trigger closeModal">Close Window</button>
</div>
