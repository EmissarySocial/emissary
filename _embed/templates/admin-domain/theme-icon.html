<!-- A theme's startup icon, or a palette for a theme that ships none. The dot is a model.Theme -->
<div class="flex-shrink-0" style="width:48px; height:48px; display:flex; align-items:center; justify-content:center;">
	<img src="/.themes/{{.ThemeID}}/resources/startup/icon.png" alt="" class="width-48" onerror="this.hidden=true; this.nextElementSibling.hidden=false">
	<span class="text-2xl text-gray" hidden>{{icon "palette"}}</span>
</div>
