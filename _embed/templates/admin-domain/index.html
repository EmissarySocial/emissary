<script src="/.themes/global/resources/sortable-1.15.7/Sortable.min.js"></script>

{{template "menubar" .}}

{{- $theme := .Theme .ThemeID -}}

<div class="flex-row margin-bottom">
	
	<div hx-get="/admin/domain/themes" class="clickable card padding-sm padding-horizontal width-1-3 flex-row flex-align-center">
		<div class="flex-grow">
			<div class="text-sm text-gray">{{icon "palette"}} Theme</div>
			<div class="text-lg bold">{{$theme.Label}}</div>
			<div class="text-sm">{{$theme.Description}}</div>

			<button class="text-xs pos-absolute-top-right">Edit</button>
		</div>
	</div>

	<div class="card padding-sm width-1-3"></div>
	<div class="card padding-sm width-1-3"></div>
</div>
